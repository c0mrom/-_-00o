<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- 検索エンジンに載せない設定 -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Word Generator</title>
  
  <!-- iPhone PWA設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="単語生成">
  <link rel="apple-touch-icon" href="IMG_4685.jpeg">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --c-dark: #4e626a;
      --c-accent: #68aac6;
      --c-mid: #899faf;
      --c-light: #a7bcc9;
      --c-bg: #dbd8d6;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--c-bg);
      color: var(--c-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      padding-bottom: 60px;
    }

    h1 {
      font-size: 1.1rem;
      margin: 0 0 12px 0;
      color: var(--c-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 生成エリア */
    .card {
      background-color: var(--c-light);
      border: 2px solid var(--c-mid);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .result-box {
      width: 100%;
      min-height: 84px;
      background-color: var(--c-bg);
      color: var(--c-dark);
      border: 2px solid var(--c-dark);
      border-radius: 8px;
      padding: 10px;
      font-size: 1rem;
      line-height: 1.5;
      resize: vertical;
      margin-bottom: 10px;
    }

    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }

    label {
      font-size: 0.85rem;
      font-weight: bold;
    }

    input[type="number"], input[type="text"], select {
      background-color: var(--c-bg);
      color: var(--c-dark);
      border: 1.5px solid var(--c-dark);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.9rem;
    }

    input[type="number"] {
      width: 60px;
    }

    .btn {
      background-color: var(--c-dark);
      color: var(--c-bg);
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      flex: 1;
    }

    .btn-accent {
      background-color: var(--c-accent);
      color: var(--c-dark);
    }

    .btn-mid {
      background-color: var(--c-mid);
      color: var(--c-bg);
    }

    .btn:active {
      opacity: 0.8;
    }

    /* 単語チップエリア */
    .category-block {
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--c-mid);
    }

    .category-title {
      font-size: 0.9rem;
      font-weight: bold;
      margin: 0 0 8px 0;
      color: var(--c-dark);
      display: flex;
      justify-content: space-between;
    }

    .chip-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      background-color: var(--c-bg);
      color: var(--c-dark);
      border: 1.5px solid var(--c-dark);
      border-radius: 16px;
      padding: 5px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip.selected {
      background-color: var(--c-accent);
      color: var(--c-dark);
      border-color: var(--c-dark);
      font-weight: bold;
    }

    .chip-del {
      font-size: 0.75rem;
      opacity: 0.7;
      padding-left: 4px;
    }

    /* アコーディオン（追加・末尾設定用） */
    details {
      background-color: var(--c-light);
      border: 1.5px solid var(--c-mid);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    summary {
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--c-dark);
      color: var(--c-bg);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <h1>
    <span>単語ジェネレーター</span>
    <button class="btn-mid" style="border:none; border-radius:6px; padding:4px 8px; font-size:0.75rem;" onclick="toggleAllChips()">全選択/解除</button>
  </h1>

  <!-- 生成＆コピーエリア -->
  <div class="card">
    <textarea id="output" class="result-box" placeholder="ここに生成されたテキストが表示されます"></textarea>
    
    <div class="controls-row">
      <label>繋げる数:</label>
      <input type="number" id="wordCount" value="4" min="1" max="30">
      <label style="margin-left:8px;">
        <input type="checkbox" id="useSuffix" checked> 単語末挿入あり
      </label>
    </div>

    <div class="controls-row" style="margin-bottom:0;">
      <button class="btn btn-accent" onclick="generateText()">ランダム生成</button>
      <button class="btn" onclick="copyText()">コピー</button>
    </div>
  </div>

  <!-- 単語リスト（カテゴリ別） -->
  <div class="card" id="wordListArea">
    <!-- JSで描画 -->
  </div>

  <!-- 新規単語追加フォーム -->
  <details>
    <summary>＋ 単語を追加する</summary>
    <div class="form-grid">
      <input type="text" id="newCategory" list="categoryList" placeholder="サブタイトル（カテゴリ名）">
      <datalist id="categoryList"></datalist>
      <input type="text" id="newWord" placeholder="追加する単語（例：あっ、んっ…）">
      <button class="btn" onclick="addWord()">リストに追加</button>
    </div>
  </details>

  <!-- 単語末挿入（ランダム）の設定 -->
  <details>
    <summary>⚙ 単語末のランダム挿入設定</summary>
    <div class="form-grid">
      <label>挿入する記号・語尾（カンマ区切り）:</label>
      <input type="text" id="suffixInput" placeholder="例：、,……,っ,♡,！">
      <label>挿入する確率（%）:</label>
      <input type="number" id="suffixProb" min="0" max="100" value="60">
      <button class="btn" onclick="saveSuffixSettings()">設定を保存</button>
    </div>
  </details>

  <div id="toast" class="toast">コピーしました</div>

  <script>
    // 初期データ（初回起動時のみ）
    const defaultData = [
      { id: 1, category: "基本", text: "あっ", selected: true },
      { id: 2, category: "基本", text: "んっ", selected: true },
      { id: 3, category: "余韻", text: "はぁ", selected: true },
      { id: 4, category: "余韻", text: "ふぅ", selected: true }
    ];

    let words = JSON.parse(localStorage.getItem('custom_words_v1')) || defaultData;
    let suffixConfig = JSON.parse(localStorage.getItem('custom_suffix_v1')) || {
      items: "、,……,っ,……っ",
      prob: 60
    };

    // 初期化
    document.getElementById('suffixInput').value = suffixConfig.items;
    document.getElementById('suffixProb').value = suffixConfig.prob;

    function saveWords() {
      localStorage.setItem('custom_words_v1', JSON.stringify(words));
      renderWords();
    }

    function renderWords() {
      const area = document.getElementById('wordListArea');
      const datalist = document.getElementById('categoryList');
      area.innerHTML = '';
      datalist.innerHTML = '';

      if (words.length === 0) {
        area.innerHTML = '<p style="font-size:0.85rem; margin:0;">下の「＋ 単語を追加する」から登録してください。</p>';
        return;
      }

      // カテゴリごとにグループ化
      const categories = [...new Set(words.map(w => w.category || '未分類'))];
      
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        datalist.appendChild(option);

        const block = document.createElement('div');
        block.className = 'category-block';
        
        const title = document.createElement('div');
        title.className = 'category-title';
        title.innerHTML = `<span>${escapeHtml(cat)}</span>`;
        block.appendChild(title);

        const container = document.createElement('div');
        container.className = 'chip-container';

        words.filter(w => (w.category || '未分類') === cat).forEach(word => {
          const chip = document.createElement('div');
          chip.className = 'chip' + (word.selected ? ' selected' : '');
          chip.onclick = () => toggleWord(word.id);

          const textSpan = document.createElement('span');
          textSpan.textContent = word.text;

          const delSpan = document.createElement('span');
          delSpan.className = 'chip-del';
          delSpan.textContent = '×';
          delSpan.onclick = (e) => {
            e.stopPropagation();
            deleteWord(word.id);
          };

          chip.appendChild(textSpan);
          chip.appendChild(delSpan);
          container.appendChild(chip);
        });

        block.appendChild(container);
        area.appendChild(block);
      });
    }

    function toggleWord(id) {
      words = words.map(w => w.id === id ? { ...w, selected: !w.selected } : w);
      saveWords();
    }

    function toggleAllChips() {
      const anyUnselected = words.some(w => !w.selected);
      words = words.map(w => ({ ...w, selected: anyUnselected }));
      saveWords();
    }

    function addWord() {
      const cat = document.getElementById('newCategory').value.trim() || '未分類';
      const text = document.getElementById('newWord').value.trim();
      if (!text) return;

      words.push({
        id: Date.now(),
        category: cat,
        text: text,
        selected: true
      });

      document.getElementById('newWord').value = '';
      saveWords();
      showToast('追加しました');
    }

    function deleteWord(id) {
      words = words.filter(w => w.id !== id);
      saveWords();
    }

    function saveSuffixSettings() {
      const items = document.getElementById('suffixInput').value;
